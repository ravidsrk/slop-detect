# unfilled_placeholders: Unfinished copy (unfilled placeholders)
# Generated by scripts/export-vale.mjs from @slop-detect/core (unfilled_placeholders) — DO NOT EDIT MANUALLY
extends: existence
message: 'Unfilled template placeholder (''%s''). Replace with concrete copy.'
level: error
ignorecase: true
nonword: true
tokens:
  - '\[(?:Your|Insert|Add|Enter)\s[^\]\n]{1,40}\]'
  - '\[(?:Company|Product|Brand|Business|Client|Customer|Founder|Startup) Name\]'
  - '\((?:Add|Insert) [^)]{1,40} here\)'
  - '\b(?:INSERT|PASTE)_[A-Z0-9_]+\b'
