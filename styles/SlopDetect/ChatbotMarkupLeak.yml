# chatbot_markup_leak: Leaked chatbot citation or internal UI markup (oaicite / attributableIndex /grok-card)
# Generated by scripts/export-vale.mjs from @slop-detect/core (chatbot_markup_leak) — DO NOT EDIT MANUALLY
extends: existence
message: 'Leaked chatbot citation or UI markup (''%s''). Remove before publishing.'
level: error
ignorecase: true
nonword: true
tokens:
  - ':?contentReference\s*\[\s*oaicite\s*:\s*\d+\s*\]\s*(?:\(\s*index\s*=\s*\d+\s*\))?'
  - '\boaicite\b'
  - '\boai_citation\s*:\s*\d+'
  - '\bcite(?:turn\d+(?:search|news|view|image|academia|product|finance|sports)\d+)+'
  - '\bturn\d+(?:search|news|view|image|academia|product|finance|sports)\d+\b'
  - '\{\s*"attribution"\s*:\s*\{\s*"attributableIndex"\s*:\s*"[^"]*"\s*\}\s*\}'
  - '\[\s*cite\s*:\s*\d+(?:\s*,\s*\d+)*\s*\]'
  - '\[span_\d+\]\((?:start|end)_span\)'
  - 'grok_render_citation_card_json|<grok-card\b'
  - '【\d+:\d+†[^】\n]{1,80}】|【\d+†L\d+(?:-L?\d+)?】'
  - '\[(?:attached_file|web|page|image):\d+\]|ppl-ai-file-upload'
  - '(?:^|\n):::(?:writing|document|code_block|canvas)\s*\{[^}\n]{0,120}\}'
