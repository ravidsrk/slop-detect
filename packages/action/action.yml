# Slop Detect — composite GitHub Action.
#
# Composite (not a JS/Docker action) on purpose: it's a single Node 20 script
# with zero external deps (built-in fetch), so there's nothing to bundle and no
# node_modules to commit. The runner already ships Node 20, so `node scan.mjs`
# just works. See scan.mjs for the actual logic.
#
# Security — pull_request_target and the url input:
#   This action accepts pull_request and pull_request_target events (see scan.mjs).
#   pull_request_target runs with a write-scoped GITHUB_TOKEN even for fork PRs.
#   The action does not check out or execute PR code — it only POSTs `url` to the
#   public slop-detect API and may post a sticky PR comment — but a misconfigured
#   workflow that passes a PR-controlled URL while using pull_request_target is a
#   footgun. Use pull_request_target ONLY when `url` is a trusted, workflow-derived
#   deploy-preview URL (from your host's API or deployment status), never from PR
#   body/title/branch content. Treat `url` as untrusted user input. Grant least
#   privilege: `permissions: pull-requests: write` (plus `contents: read` if needed).
name: 'Slop Detect'
description: 'Score a landing page against the AI-design-slop fingerprint and gate PRs.'
author: 'Ravindra Kumar'

branding:
  icon: 'eye'
  color: 'gray-dark'

inputs:
  url:
    description: 'The page (URL) to scan — typically a trusted, workflow-derived deploy-preview URL. Treat as untrusted input: pass only URLs your workflow resolves from your host, never PR-controlled content (especially on pull_request_target).'
    required: true
  fail-under:
    # NOTE on semantics: the slop score is 0–100 where LOWER is better. So
    # "fail-under" here means "fail if the slop score climbs ABOVE this number".
    #   - Empty (default) → report-only, never fails the check.
    #   - Numeric (e.g. '10') → fail when score > 10.
    #   - Letter grade (e.g. 'B') → fail when the page grades WORSE than B.
    description: 'Fail the check if the slop score exceeds this number, or (if a letter grade like "B" is given) if the page grades worse than it. Empty = report-only.'
    required: false
    default: ''
  api-base:
    description: 'Base URL of the slop-detect API.'
    required: false
    default: 'https://slop-detect.com'
  axes:
    description: 'Axes to score: "design" (default), "design,copy", "design,craft", or "all" (design + copy). Craft is a separate floor and does not change the fail-under gate. "all" stays design + copy so it keeps working against an API that has not deployed the craft axis yet.'
    required: false
    default: 'design'
  preset:
    description: 'Scoring preset: full (default), strict, marketing, minimal.'
    required: false
    default: 'full'
  design-md:
    description: 'Check DESIGN.md system compliance ("auto" for <origin>/DESIGN.md, an http(s) URL, or empty to skip).'
    required: false
    default: ''
  aeo:
    description: 'Run the AEO crawler & citation readiness checks ("true"/"false").'
    required: false
    default: 'false'
  api-key:
    description: 'Optional API key (SLOP_API_KEY) for higher scan rate limits.'
    required: false
    default: ''
  share:
    description: 'Mint a public shareable permalink for the scan ("true"/"false").'
    required: false
    default: 'true'
  comment:
    description: 'Post/update a sticky PR comment with the report ("true"/"false").'
    required: false
    default: 'true'
  github-token:
    description: 'Token used to post the sticky PR comment.'
    required: false
    default: ${{ github.token }}

outputs:
  score:
    description: 'Slop score 0–100 (lower is better).'
    value: ${{ steps.scan.outputs.score }}
  grade:
    description: 'Letter grade (A+ … F).'
    value: ${{ steps.scan.outputs.grade }}
  tier:
    description: 'Tier bucket: Clean / Mild / Heavy.'
    value: ${{ steps.scan.outputs.tier }}
  verdict:
    description: 'One-line human-readable verdict.'
    value: ${{ steps.scan.outputs.verdict }}
  copy-score:
    description: 'Copy axis score 0–100 (lower is better), when copy axis is enabled.'
    value: ${{ steps.scan.outputs.copy-score }}
  unified-score:
    description: 'Unified multi-axis score 0–100 (lower is better).'
    value: ${{ steps.scan.outputs.unified-score }}
  system-score:
    description: 'DESIGN.md system compliance score 0–100 (higher is better), when design-md is enabled.'
    value: ${{ steps.scan.outputs.system-score }}
  aeo-score:
    description: 'AEO readiness score 0–100 (higher is better), when aeo is enabled.'
    value: ${{ steps.scan.outputs.aeo-score }}
  result-url:
    description: 'Shareable result page URL.'
    value: ${{ steps.scan.outputs.result-url }}

runs:
  using: 'composite'
  steps:
    # Single step does everything: scan → outputs → summary → sticky comment →
    # threshold gate. Inputs are passed via INPUT_* env so the script stays a
    # plain Node module with no @actions/core dependency. GITHUB_* context vars
    # (GITHUB_OUTPUT, GITHUB_STEP_SUMMARY, GITHUB_EVENT_NAME, GITHUB_EVENT_PATH,
    # GITHUB_REPOSITORY, GITHUB_API_URL) are already present in the env.
    - id: scan
      shell: bash
      run: node "${{ github.action_path }}/scan.mjs"
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_FAIL_UNDER: ${{ inputs.fail-under }}
        INPUT_API_BASE: ${{ inputs.api-base }}
        INPUT_AXES: ${{ inputs.axes }}
        INPUT_PRESET: ${{ inputs.preset }}
        INPUT_DESIGN_MD: ${{ inputs.design-md }}
        INPUT_AEO: ${{ inputs.aeo }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_SHARE: ${{ inputs.share }}
        INPUT_COMMENT: ${{ inputs.comment }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
