<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Solid dark square with a tiny scan-line motif. The detector mark.
       Deliberately not gradient, not purple, not Inter — to be the opposite
       of the patterns we score against. -->
  <rect width="64" height="64" rx="12" fill="#0a0a0b"/>
  <rect x="10" y="14" width="44" height="2" fill="#f5f5f7"/>
  <rect x="10" y="22" width="32" height="2" fill="#f5f5f7" opacity="0.55"/>
  <rect x="10" y="30" width="44" height="2" fill="#f5f5f7" opacity="0.7"/>
  <rect x="10" y="38" width="20" height="2" fill="#f87171"/>
  <rect x="10" y="46" width="44" height="2" fill="#f5f5f7" opacity="0.4"/>
  <circle cx="50" cy="47" r="6" fill="none" stroke="#f87171" stroke-width="2"/>
</svg>
