<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Same hover on four cards</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Georgia, 'Times New Roman', serif; background: #ffffff; color: #1a1a1a; padding: 32px; }
    .card { width: 200px; height: 120px; margin: 8px; padding: 12px; background: #f4f4f4; transition: transform 200ms ease; }
  </style>
</head>
<body>
<div class="card">Card one</div><div class="card">Card two</div><div class="card">Card three</div><div class="card">Card four</div>
</body>
