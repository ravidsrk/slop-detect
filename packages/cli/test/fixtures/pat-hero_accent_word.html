<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One colored word in the headline</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Georgia, 'Times New Roman', serif; background: #ffffff; color: #1a1a1a; padding: 32px; }
    h1 { font-size: 44px; color: #1a1a1a; font-style: normal; } h1 em { color: #b3541e; font-style: italic; }
  </style>
</head>
<body>
<h1>Ship <em>faster</em> today</h1>
<p>The middle word is the only accent.</p>
</body>
</html>
