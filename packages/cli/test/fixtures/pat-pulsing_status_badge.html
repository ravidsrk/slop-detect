<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketing live badge</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Georgia, 'Times New Roman', serif; background: #ffffff; color: #1a1a1a; padding: 32px; }
    @keyframes pulse { 50% { opacity: 0.4; } } .badge { display: inline-flex; align-items: center; gap: 6px; } .dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; animation: pulse 1.2s infinite; }
  </style>
</head>
<body>
<h1>Shipping today</h1>
<p class="badge"><span class="dot"></span>Live</p>
</body>
</html>
