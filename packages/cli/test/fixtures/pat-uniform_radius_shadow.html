<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One radius and one shadow</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Georgia, 'Times New Roman', serif; background: #ffffff; color: #1a1a1a; padding: 32px; }
    .box { border-radius: 16px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); background: #f7f7f7; margin: 8px; } .chip { width: 80px; height: 32px; } .card { width: 220px; height: 140px; } .modal { width: 480px; height: 200px; }
  </style>
</head>
<body>
<div class="box chip">A</div><div class="box chip">B</div><div class="box chip">C</div>
<div class="box card">Card one</div><div class="box card">Card two</div><div class="box card">Card three</div>
<div class="box modal">Wide panel one</div><div class="box modal">Wide panel two</div>
</body>
</html>
