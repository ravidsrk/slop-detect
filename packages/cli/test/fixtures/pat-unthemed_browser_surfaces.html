<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark page without a color scheme</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Georgia, 'Times New Roman', serif; background: #ffffff; color: #1a1a1a; padding: 32px; }
    html, body { background: #0a0a0b; color: #eee; }
  </style>
</head>
<body>
<h1>Dark page</h1>
<p>The root element does not set color-scheme.</p>
</body>
</html>
