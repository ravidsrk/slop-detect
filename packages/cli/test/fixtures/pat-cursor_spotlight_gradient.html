<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mouse spotlight</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Georgia, 'Times New Roman', serif; background: #ffffff; color: #1a1a1a; padding: 32px; }
    .spot { width: 240px; height: 140px; }
  </style>
</head>
<body>
<div class="spot" style="background: radial-gradient(circle at var(--mouse-x) var(--mouse-y), #fff, #111);">Spotlight</div>
</body>
</html>
