<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Below-fold fade</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Georgia, 'Times New Roman', serif; background: #ffffff; color: #1a1a1a; padding: 32px; }
    .spacer { height: 100vh; } .fade { opacity: 0; transform: translateY(16px); } section { min-height: 48px; }
  </style>
</head>
<body>
<main>
  <div class="spacer">Top of the page.</div>
  <section><p class="fade">One</p><p class="fade">Two</p></section>
  <section><p class="fade">Three</p><p class="fade">Four</p></section>
  <section><p class="fade">Five</p><p class="fade">Six</p></section>
</main>
</body>
</html>
