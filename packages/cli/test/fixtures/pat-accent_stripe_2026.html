<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two-pixel card stripes</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Georgia, 'Times New Roman', serif; background: #ffffff; color: #1a1a1a; padding: 32px; }
    .card { width: 360px; min-height: 120px; margin: 0 0 20px; padding: 20px; background: #fafafa; border-top: 2px solid #6366f1; border-radius: 8px; } h1 { font-size: 32px; margin-bottom: 16px; }
  </style>
</head>
<body>
<h1>Thin top stripes</h1>
<section class="card"><h2>Bakery</h2><p>Weekly flour delivery in fifty-pound sacks.</p></section>
<section class="card"><h2>Restaurant</h2><p>Standing orders with net-thirty terms.</p></section>
</body>
</html>
