<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Six colored chips</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Georgia, 'Times New Roman', serif; background: #ffffff; color: #1a1a1a; padding: 32px; }
    .chip { display: inline-block; height: 28px; line-height: 28px; padding: 0 14px; margin: 4px; border-radius: 999px; color: #fff; font-size: 13px; }
  </style>
</head>
<body>
<h1>Tags</h1>
<span class="chip" style="background:#e11d48">Design</span>
<span class="chip" style="background:#2563eb">Build</span>
<span class="chip" style="background:#16a34a">Grow</span>
<span class="chip" style="background:#ea580c">Ship</span>
<span class="chip" style="background:#7c3aed">Scale</span>
<span class="chip" style="background:#0d9488">Host</span>
</body>
</html>
