<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copperfield Credit Union — By the numbers</title>
  <style>
    /* Per-pattern golden for stat_banner (T-18b): three large numeric tokens
       in one horizontal row. Plain otherwise. */
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:Georgia, 'Times New Roman', serif; background:#fff;
           color:#1a1a1a; padding:48px 24px; max-width:900px; margin:0 auto; }
    h1 { font-size:38px; margin-bottom:8px; }
    .lede { font-size:18px; color:#333; margin-bottom:28px; }
    .stats { display:flex; gap:32px; margin-bottom:16px; }
    .stat b { display:block; font-size:52px; font-weight:700; }
    .stat span { font-size:15px; color:#444; }
    footer { margin-top:32px; color:#555; font-size:14px; }
  </style>
</head>
<body>
  <h1>A credit union, by the numbers</h1>
  <p class="lede">Member-owned since 1962. Here is the shape of us today.</p>
  <div class="stats">
    <div class="stat"><b>40k+</b><span>members served</span></div>
    <div class="stat"><b>99.9%</b><span>loan approval rate</span></div>
    <div class="stat"><b>$2M+</b><span>returned in dividends</span></div>
  </div>
  <footer>Copperfield Credit Union — NCUA insured</footer>
</body>
</html>
