<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledger — plain-text accounting</title>
  <style>
    /* A clean page that happens to have a PILL-SHAPED "Sign up" button above a
       centered hero. Regression guard: the eyebrow-pill pattern must NOT fire on
       a CTA/nav button (it used to, via an over-broad catch-all — see
       hero_eyebrow_pill). System serif, no gradients, no purple → stays Clean. */
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: Georgia, 'Times New Roman', serif; color:#1a1a1a; background:#fff;
           text-align:center; }
    header { padding:28px; }
    .signup { display:inline-block; padding:8px 20px; border-radius:9999px;
              background:#1a1a1a; color:#fff; text-decoration:none; font-size:14px; }
    main { padding:40px 24px 80px; }
    h1 { font-size:48px; font-weight:700; max-width:14ch; margin:0 auto 16px; }
    p { font-size:18px; color:#333; max-width:56ch; margin:0 auto; line-height:1.55; }
  </style>
</head>
<body>
  <header><a class="signup" href="/signup">Sign up</a></header>
  <main>
    <h1>Plain-text accounting for people who hate spreadsheets.</h1>
    <p>Ledger keeps your books in a single text file you can read, diff, and back
      up anywhere. No lock-in, no monthly fee, no dashboard you have to learn.</p>
  </main>
</body>
</html>
