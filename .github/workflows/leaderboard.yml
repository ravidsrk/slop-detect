name: leaderboard

# Regenerate public/leaderboard.json by scanning the curated corpus, then open
# a PR if it changed. Manual + monthly. Uses the live API (no browser needed).
#
# A PR (not a direct push) because main is branch-protected: the bot cannot
# push to it, so the old direct-push step failed on every run.
#
# Set repo secret SLOP_API_KEY (an API key) to lift the anonymous per-IP scan
# throttle so the run finishes fast; without it the run still works but is slow.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st of each month

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Scan corpus → public/leaderboard.json
        env:
          SLOP_API_KEY: ${{ secrets.SLOP_API_KEY }}
        run: bun apps/web/leaderboard/build.mjs
      - name: Open refresh PR if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- apps/web/public/leaderboard.json; then
            echo "No change in leaderboard dataset."
            exit 0
          fi
          BR="bot/leaderboard-$(date -u +%Y%m%d)"
          git config user.name "slop-detect-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -b "$BR"
          git add apps/web/public/leaderboard.json
          git commit -m "data: refresh leaderboard dataset"
          git push -u origin "$BR"
          gh pr create --title "data: refresh leaderboard dataset" \
            --body "Automated monthly refresh from the curated corpus (leaderboard.yml). Scored via the live API; review the diff, then merge." \
            --base main --head "$BR"
