name: preview

# PR previews for apps/web on Cloudflare Pages (T-29 staging story).
#
# Every pull request gets a branch preview deployment — EXCEPT the workflow
# self-skips (with a notice, never red) until staging is actually wired:
#   1. CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets (H-01), and
#   2. live (uncommented) preview_id lines in apps/web/wrangler.toml.
# Gate 2 is the safety interlock: a preview without preview_id would bind
# PRODUCTION KV, which must be impossible, not merely undocumented.
#
# Branch controls: main → production (deploy.yml, CI-gated). PR branches →
# here. Previews never promote except by merging to main. See docs/STAGING.md.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy PR preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Preflight — staging ready
        id: preflight
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Preview skipped: CLOUDFLARE_* repo secrets missing (H-01)."
            exit 0
          fi
          if ! grep -qE '^[[:space:]]*preview_id[[:space:]]*=' apps/web/wrangler.toml; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Preview skipped: no live preview_id in wrangler.toml (staging not wired)."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.preflight.outputs.ready == 'true'
        with:
          bun-version: 1.4.2

      - run: bun install
        if: steps.preflight.outputs.ready == 'true'

      # Same gates as production: never preview a build that doesn't
      # compile or a suite that's red.
      - run: bun run build
        if: steps.preflight.outputs.ready == 'true'

      - run: bun run test
        if: steps.preflight.outputs.ready == 'true'

      - name: Publish preview (wrangler pages deploy --branch)
        if: steps.preflight.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy public --project-name=slop-detector --branch=${{ github.head_ref }}

      - name: Comment preview pointer
        if: steps.preflight.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body \
            "Preview deployed for \`${{ github.head_ref }}\` @ \`${{ github.sha }}\` (branch preview binding preview KV only — see docs/STAGING.md). Find the build under the slop-detector Pages project deployments in the Cloudflare dashboard."
