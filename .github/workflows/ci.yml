name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      # --frozen-lockfile: a stale bun.lock fails CI instead of being rewritten.
      - run: bun install --frozen-lockfile
      - name: Prettier (format check)
        run: bun run format:check
      - name: ESLint (correctness)
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      # --frozen-lockfile: a stale bun.lock fails CI instead of being rewritten.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      # --frozen-lockfile: a stale bun.lock fails CI instead of being rewritten.
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
      - name: Scan-result schema compatibility
        run: |
          git fetch origin main --depth=1
          node schemas/check-schema-compat.mjs

  smoke-cli:
    name: Smoke test CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      # --frozen-lockfile: a stale bun.lock fails CI instead of being rewritten.
      - run: bun install --frozen-lockfile
      - name: Build CLI + core
        run: bun run --filter @slop-detect/core build && bun run --filter slop-detect build
      - name: Install Playwright Chromium
        # Pinned to the workspace playwright (bare `bunx playwright` may resolve a
        # newer rev whose browsers 1.65.0 refuses). Keep in sync with engine-pin.test.js.
        run: bunx --package playwright@1.65.0 playwright install --with-deps chromium
      - name: Golden detector tests (real Chromium)
        env:
          # Chromium was installed above — skip the CLI's lazy installer.
          SKIP_PLAYWRIGHT_DOWNLOAD: 1
        # Same command contributors run locally (bun run test:golden), minus the
        # build the previous step already did.
        run: bun run --filter slop-detect-mcp build && bun run --filter slop-detect --filter slop-detect-mcp test:golden
      - name: Plugin and init npx commands scan with nothing installed (#357)
        env:
          SKIP_PLAYWRIGHT_DOWNLOAD: 1
        run: node scripts/smoke-mcp-npx.mjs

      - name: Serve local clean fixture
        run: |
          cd packages/cli/test/fixtures
          python3 -m http.server 8765 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/clean-artisan.html >/dev/null && break
            sleep 0.2
          done
          echo "FIXTURE_URL=http://127.0.0.1:8765/clean-artisan.html" >> "$GITHUB_ENV"
      - name: Scan hermetic clean fixture
        env:
          # Chromium was installed above — skip the CLI's lazy installer so its
          # download progress can't pollute stdout (which is redirected to JSON).
          SKIP_PLAYWRIGHT_DOWNLOAD: 1
        run: |
          cd packages/cli
          node dist/bin/slop.js "$FIXTURE_URL" --json > result.json
          cat result.json
          score=$(node -e "console.log(JSON.parse(require('fs').readFileSync('result.json')).score)")
          echo "Score: $score"
          if [ "$score" -gt 9 ]; then
            echo "::error::Clean artisan fixture should score Clean (<= 9), got $score"
            exit 1
          fi
      - name: MCP local hook scans a dev server
        env:
          SKIP_PLAYWRIGHT_DOWNLOAD: 1
        run: |
          cd packages/cli/test/fixtures
          python3 -m http.server 8766 >/tmp/hook-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8766/clean-artisan.html >/dev/null && break
            sleep 0.2
          done
          cd "$GITHUB_WORKSPACE"
          SLOP_LOCAL_URL=http://127.0.0.1:8766/clean-artisan.html \
            node packages/mcp/hooks/scan-local.mjs > hook-result.json
          node -e "const d=JSON.parse(require('fs').readFileSync('hook-result.json','utf8')); if (d.schemaVersion!==1 || typeof d.score!=='number' || d.blocked) { console.error(d); process.exit(1); } console.log('hook score', d.score);"

  rust-engine:
    name: Rust engine & WASM parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Run Rust clippy and workspace + oracle parity tests
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Build native release CLI binary
        run: cargo build --release --locked -p slop-cli
      - name: Smoke test native CLI + all golden fixtures via raw CDP (zero Playwright)
        run: |
          ./target/release/slop-detect engine-probe
          ./target/release/slop-detect doctor
          ./target/release/slop-detect design lint ./DESIGN.md --format agent
          ./target/release/slop-detect check ./DESIGN.md --format agent
          node scripts/test-rust-cdp-golden.mjs
          node scripts/sync-skills.mjs --check
      - name: Build and verify wasm32-unknown-unknown module
        run: |
          cargo build --release --locked --target wasm32-unknown-unknown -p slop-wasm
          node scripts/verify-wasm.mjs
