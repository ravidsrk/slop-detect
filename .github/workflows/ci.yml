name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: ESLint
        run: npm run lint
      - name: Prettier (format check)
        run: npm run format:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` (not --ignore-scripts) links the workspace packages so the
      # CLI's `import 'slop-detect-core'` resolves. Playwright is intentionally
      # NOT installed here — the unit suite is browser-free (it's lazy-loaded),
      # so this job stays fast. Real browser scanning is covered by smoke-cli.
      - run: npm ci
      - run: npm test

  smoke-cli:
    name: Smoke test CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Golden detection fixtures (clean vs slop)
        run: RUN_GOLDEN=1 node --test packages/cli/test/golden.test.js
      - name: Scan a known-clean page (HN)
        run: |
          cd packages/cli
          node bin/slop.js https://news.ycombinator.com --json > result.json
          cat result.json
          score=$(node -e "console.log(JSON.parse(require('fs').readFileSync('result.json')).score)")
          echo "Score: $score"
          if [ "$score" -gt 12 ]; then
            echo "::error::Hacker News should score Clean (< 12), got $score"
            exit 1
          fi
