name: deploy

# Deploys the web app (apps/web) to Cloudflare Pages.
#
# Triggers:
#   • workflow_run — auto-deploys after the `ci` workflow succeeds on main
#                    (CI is the gate; a red build never ships). This is the
#                    continuous-deploy path.
#   • workflow_dispatch — deploy on demand from the Actions tab. Main only:
#                    the ref guard below refuses manual runs from any other
#                    branch (publishing uses --branch main, so anything else
#                    would ship unreviewed code to production).
#   • tags v*           — deploy when you cut a release tag (v0.6.0, …) from
#                    main. The ref guard verifies tag containment in main.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — a scoped token with "Pages: Write".
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id.
# Without them the job fails fast with a clear message (it does not silently
# no-op).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: ['ci']
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production
    # For the workflow_run trigger, only deploy when CI actually passed.
    # workflow_dispatch and tag pushes always proceed (no upstream run to gate on).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # On workflow_run, check out the exact commit that passed CI (defaults
          # would grab the branch HEAD). Empty ref on other triggers = default.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Preflight — required secrets present
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repo secrets."
            exit 1
          fi

      # Publishing uses --branch main, so the checked-out ref MUST be main (or
      # a tag contained in it) — otherwise a manual run from a feature branch
      # would ship unreviewed code straight to production (P1 on PR #190).
      - name: Preflight — ref is production-eligible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::manual production deploys must run from main (selected: ${{ github.ref }})."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
            status=$(gh api "repos/${{ github.repository }}/compare/main...${tag}" --jq '.status' 2>/dev/null) || status="error"
            if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
              echo "::error::release tag ${tag} is not contained in main (compare status: ${status}); cut release tags from main."
              exit 1
            fi
          fi

      - run: bun install

      # Compile @slop-detect/core to dist — the web functions import it, so
      # wrangler needs the built output present when it bundles them.
      - run: bun run build

      # Gate the deploy on the test suite — never ship a red build.
      - run: bun run test

      - name: Publish (wrangler pages deploy)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          # --branch main is load-bearing: without it `pages deploy` creates a
          # PREVIEW deployment and production never moves (S5 finding for
          # #152 — prod served pre-T-14 wording with /api/health missing for
          # 12h+ across 20 green main merges while health-ping stayed red).
          command: pages deploy public --project-name=slop-detector --branch main
