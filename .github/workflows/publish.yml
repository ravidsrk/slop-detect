name: publish

# Publishes the npm packages (@slop-detect/core, slop-detect, slop-detect-mcp)
# on a release tag. This is the funnel: `npx slop-detect` only ever resolves to
# what is on npm, so a merged-but-unpublished version is invisible to users.
#
# Trigger: a version tag (v0.8.0, v0.8.1, …). Cut the tag AFTER the version bump
# is on main and CHANGELOG is updated.
#
# Required repository secret:
#   NPM_TOKEN — an npm automation token with publish rights to the three
#               packages. Without it the job fails fast (it does not silently
#               no-op), so a release can never appear to succeed while npm stays
#               stale.
# Note: the workspace name is @slop-detect/core, but core's `prepack` renames
# it to the unscoped `slop-detect-core` before packing, so that is the name
# that lands on npm (no npm org needed).
#
# Publish order matters: `slop-detect` (CLI) depends on `@slop-detect/core`,
# so core must land first.
#
# Packing matters just as much: the CLI depends on core via "workspace:*",
# which plain `npm publish` leaves UNREWRITTEN — the published CLI would be
# uninstallable. So each package is packed with `bun pm pack` (which rewrites
# workspace:* to the real version), the tarball is asserted workspace-free,
# and the TARBALL is what gets published.
#
# Manual runs are dry-runs unless `dry_run: false` is chosen explicitly, so
# rehearsing a release can never half-publish it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack + verify only; do not publish'
        type: boolean
        default: true

permissions:
  contents: write # GitHub Release + Vale rules asset
  id-token: write # npm --provenance

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install npm >= 11.5.1
        run: |
          npm install -g --no-audit --no-fund "npm@^11.5.1"
          NPM_VER="$(npm --version)"
          if ! printf '11.5.1\n%s\n' "$NPM_VER" | sort -V -C; then
            echo "::error::npm $NPM_VER is older than required 11.5.1."
            exit 1
          fi
          echo "npm $NPM_VER (>= 11.5.1)"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Preflight — NPM_TOKEN present (real publishes only)
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN must be set as a repo secret to publish."
            exit 1
          fi

      - run: bun install --frozen-lockfile --ignore-scripts

      # Build all three publishable packages (turbo handles dependency order).
      - run: bun run build

      # Gate the release on the unit suite — never publish a red build.
      - run: bun run test

      # Guard: a tag must match the versions it claims to publish. Stops a stale
      # `v0.8.0` tag from re-publishing 0.7.0 (or failing midway, half-released).
      - name: Verify tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for pkg in core cli mcp; do
            PV="$(node -p "require('./packages/$pkg/package.json').version")"
            if [ "$PV" != "$TAG" ]; then
              echo "::error::tag $GITHUB_REF_NAME != packages/$pkg version $PV — bump versions before tagging."
              exit 1
            fi
          done

      # Pack with bun (rewrites workspace:* → real version), assert each
      # directory's tarball carries the expected published package name, and
      # assert no tarball still carries a workspace: spec before publishing.
      - name: Pack all three packages (bun pm pack)
        run: |
          mkdir -p tarballs
          for spec in \
            "packages/core:slop-detect-core" \
            "packages/cli:slop-detect" \
            "packages/mcp:slop-detect-mcp"
          do
            pkg_dir="${spec%%:*}"
            expected_name="${spec#*:}"
            rm -f "$pkg_dir"/*.tgz
            (cd "$pkg_dir" && bun pm pack)
            shopt -s nullglob
            packed=("$pkg_dir"/*.tgz)
            shopt -u nullglob
            if [ "${#packed[@]}" -ne 1 ]; then
              echo "::error::Expected exactly 1 tarball in $pkg_dir, found ${#packed[@]}."
              exit 1
            fi
            tarball="${packed[0]}"
            actual_name="$(tar -xzOf "$tarball" package/package.json | node -e 'const fs = require("fs"); process.stdout.write(JSON.parse(fs.readFileSync(0, "utf8")).name || "");')"
            if [ "$actual_name" != "$expected_name" ]; then
              echo "::error::$pkg_dir tarball ($tarball) has package/package.json name '$actual_name', expected '$expected_name'."
              exit 1
            fi
            mv "$tarball" tarballs/
          done
          ls -la tarballs
          for t in tarballs/*.tgz; do
            tar -xzOf "$t" package/package.json | node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync(0, "utf8"));
              for (const field of ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"]) {
                for (const [k, v] of Object.entries(pkg[field] || {})) {
                  if (String(v).startsWith("workspace:")) {
                    console.error(`::error::${process.argv[1]} has unresolved workspace dependency ${field}.${k}=${v}`);
                    process.exit(1);
                  }
                  if (field !== "devDependencies" && k === "@slop-detect/core") {
                    console.error(`::error::${process.argv[1]} has unpublished scoped ${field}.${k} (expected slop-detect-core)`);
                    process.exit(1);
                  }
                }
              }
            ' "$t"
          done
          (cd styles && zip -rq "$GITHUB_WORKSPACE/tarballs/SlopDetect.zip" SlopDetect)

      # Smoke the packed CLI, core, and MCP server before publishing: install the
      # tarballs in a clean dir and verify all three packages load cleanly.
      - name: Install-smoke the packed tarballs
        run: |
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/tarballs/*.tgz
          ./node_modules/.bin/slop-detect --help >/dev/null
          ./node_modules/.bin/slop-detect --version
          node -e 'import("slop-detect-core").then((m) => { if (!m.PATTERNS?.length) process.exit(1); })'
          node -e 'import("slop-detect-mcp").then((m) => { if (!m.TOOLS?.length) process.exit(1); })'
          echo "packed core, CLI, and MCP install and run"

      - name: Resolve publish mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" != "false" ]; then
            echo "args=--dry-run" >> "$GITHUB_OUTPUT"
            echo "Manual dry-run: packing verified, nothing will be published."
          else
            echo "args=--provenance" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish slop-detect-core
        run: npm publish tarballs/slop-detect-core-*.tgz --access public ${{ steps.mode.outputs.args }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish slop-detect (CLI)
        run: npm publish tarballs/slop-detect-[0-9]*.tgz --access public ${{ steps.mode.outputs.args }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish slop-detect-mcp
        run: npm publish tarballs/slop-detect-mcp-*.tgz --access public ${{ steps.mode.outputs.args }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release and update floating major tag
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            NOTES_FILE="$(mktemp)"
            node -e '
              const fs = require("fs");
              const ver = process.env.TAG_NAME;
              const cl = fs.readFileSync("CHANGELOG.md", "utf8");
              const esc = ver.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const m = cl.match(new RegExp(`^## ${esc}[^\\n]*\\n([\\s\\S]*?)(?=\\n## |$)`, "m"));
              fs.writeFileSync(process.argv[1], m ? m[1].trim() + "\n" : `Release ${ver}\n`);
            ' "$NOTES_FILE"
            gh release create "$TAG_NAME" tarballs/SlopDetect.zip \
              --title "$TAG_NAME" \
              --notes-file "$NOTES_FILE"
          fi
          MAJOR_TAG="$(echo "$TAG_NAME" | sed -E 's/^(v[0-9]+)\..*$/\1/')"
          if [ -n "$MAJOR_TAG" ] && [ "$MAJOR_TAG" != "$TAG_NAME" ]; then
            git config user.name "Ravindra Kumar"
            git config user.email "ravidsrk@gmail.com"
            git tag -f "$MAJOR_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$MAJOR_TAG" --force
          fi

      - name: Publish slop-detect-mcp to Official MCP Registry
        if: (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) && env.MCP_REGISTRY_ENABLED == 'true'
        continue-on-error: true
        working-directory: packages/mcp
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ -n "$TAG" ]; then
            node -e 'const fs=require("fs"),f="server.json",j=JSON.parse(fs.readFileSync(f,"utf8"));j.version=process.env.TAG;if(j.packages&&j.packages[0])j.packages[0].version=process.env.TAG;fs.writeFileSync(f,JSON.stringify(j,null,2)+"\n");'
          fi
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz -o /tmp/mcp-publisher.tar.gz
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          chmod +x /tmp/mcp-publisher
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish
        env:
          TAG: ${{ github.ref_name }}

