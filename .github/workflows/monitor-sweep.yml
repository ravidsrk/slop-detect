name: monitor-sweep

# Daily trigger for the monitoring sweep (re-scan watched domains, email owners
# on a new regression). The work runs in the Pages Function /api/cron/sweep;
# this just pokes it on a schedule.
#
# OFF until explicitly enabled: scheduled runs only execute when the repo
# variable MONITORING_ENABLED is "true" — otherwise the job shows as SKIPPED
# in the Actions UI instead of a green check that checked nothing (which is
# how disabled monitoring hid for months). A manual run always executes and
# fails loudly if CRON_SECRET is missing.
#
# To enable: set repo secret CRON_SECRET (must match the Pages env var of the
# same name) and repo variable MONITORING_ENABLED=true. Optionally set repo
# variable SWEEP_URL (defaults to production).

on:
  schedule:
    - cron: '17 8 * * *' # daily at 08:17 UTC
  workflow_dispatch:

jobs:
  sweep:
    if: vars.MONITORING_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sweep
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SWEEP_URL: ${{ vars.SWEEP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET not set — monitoring is not configured. Set the repo secret (matching the Pages env var) or leave MONITORING_ENABLED unset."
            exit 1
          fi
          url="${SWEEP_URL:-https://slop-detect.com/api/cron/sweep}"
          code=$(curl -sS -o /tmp/sweep.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$url")
          echo "HTTP $code"; cat /tmp/sweep.json || true; echo
          if [ "$code" != "200" ]; then
            echo "::error::sweep returned $code"
            exit 1
          fi
