<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for /landing/og.png. New light editorial-instrument theme (build task
       13): cool paper, Newsreader serif display, JetBrains Mono data voice, the
       verdict scale carrying the score. No gradient, no old Hanken/Martian faces.
       Rasterize at 1200x630 with the brand fonts available — the @import below lets
       a browser (or headless Chrome) load them, so a screenshot renders them. -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      .serif { font-family: 'Newsreader', Georgia, serif; font-weight: 500; }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace; }
    </style>
  </defs>

  <!-- paper -->
  <rect width="1200" height="630" fill="#F4F5F2"/>

  <!-- masthead: the logo lockup + a mono stamp -->
  <g transform="translate(72,54) scale(1.5)" fill="none">
    <path d="M3 8 V3.5 H7.5" stroke="#181815" stroke-width="1.6" stroke-linecap="square"/>
    <path d="M16.5 3.5 H21 V8" stroke="#181815" stroke-width="1.6" stroke-linecap="square"/>
    <path d="M21 16 V20.5 H16.5" stroke="#181815" stroke-width="1.6" stroke-linecap="square"/>
    <path d="M7.5 20.5 H3 V16" stroke="#181815" stroke-width="1.6" stroke-linecap="square"/>
    <circle cx="12" cy="12" r="2.4" fill="#1FA85E"/>
  </g>
  <text x="120" y="83" class="mono" font-size="27" font-weight="700" letter-spacing="-0.3" fill="#181815">slop-detect</text>
  <text x="1128" y="83" text-anchor="end" class="mono" font-size="16" fill="#6E6F63">deterministic design-slop scoring</text>

  <!-- headline (Newsreader display, kept left of the grade card) -->
  <text x="72" y="244" class="serif" font-size="62" letter-spacing="-1" fill="#181815">Grade any landing</text>
  <text x="72" y="312" class="serif" font-size="62" letter-spacing="-1" fill="#181815">page on how it</text>
  <text x="72" y="380" class="serif" font-size="62" letter-spacing="-1" fill="#181815">reads as AI slop.</text>

  <!-- subline (mono data voice) -->
  <text x="74" y="448" class="mono" font-size="21" fill="#46473F">27 deterministic checks · a 0–100 score,</text>
  <text x="74" y="482" class="mono" font-size="21" fill="#46473F">a letter grade, and the exact tells.</text>

  <!-- url + command -->
  <text x="74" y="558" class="mono" font-size="23" font-weight="500" fill="#15824A">slop-detect.com</text>
  <text x="330" y="558" class="mono" font-size="20" fill="#6E6F63">npx slop-detect &lt;url&gt;</text>

  <!-- signature: the grade card (a real measured reading) -->
  <g transform="translate(770,150)">
    <rect x="0" y="0" width="358" height="330" rx="6" fill="#FBFBF9" stroke="#DBDDD6" stroke-width="1"/>
    <!-- card cap -->
    <text x="26" y="42" class="mono" font-size="18" font-weight="700" fill="#181815">bolt.new</text>
    <text x="332" y="42" text-anchor="end" class="mono" font-size="14" fill="#6E6F63">live scan</text>
    <line x1="0" y1="62" x2="358" y2="62" stroke="#E7E8E2" stroke-width="1"/>
    <!-- grade + score -->
    <text x="26" y="172" class="serif" font-size="104" letter-spacing="-3" fill="#B23A2A">D+</text>
    <text x="188" y="132" class="mono" font-size="34" font-weight="700" fill="#181815">33<tspan font-size="19" font-weight="400" fill="#9A9B8E"> /100</tspan></text>
    <!-- tier pill -->
    <rect x="188" y="150" width="120" height="34" rx="6" fill="#FBFBF9" stroke="#DBDDD6" stroke-width="1"/>
    <circle cx="206" cy="167" r="6" fill="#C9402E"/>
    <text x="222" y="173" class="mono" font-size="15" font-weight="700" letter-spacing="0.3" fill="#B23A2A">HEAVY</text>
    <!-- the named tells -->
    <line x1="26" y1="212" x2="332" y2="212" stroke="#DBDDD6" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="26" y="246" class="mono" font-size="15" fill="#46473F">AI-default font stack</text>
    <text x="332" y="246" text-anchor="end" class="mono" font-size="15" font-weight="700" fill="#B23A2A">+8</text>
    <text x="26" y="278" class="mono" font-size="15" fill="#46473F">Aurora / mesh gradient</text>
    <text x="332" y="278" text-anchor="end" class="mono" font-size="15" font-weight="700" fill="#B23A2A">+5</text>
    <text x="26" y="310" class="mono" font-size="15" fill="#46473F">Centered hero, generic sans</text>
    <text x="332" y="310" text-anchor="end" class="mono" font-size="15" font-weight="700" fill="#B23A2A">+4</text>
  </g>
</svg>
