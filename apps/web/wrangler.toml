name = "slop-detector"
pages_build_output_dir = "public"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Browser Rendering binding — gives the Pages Function access to a
# real headless Chromium via @cloudflare/puppeteer. The 'BROWSER' name here is
# what env.BROWSER refers to inside functions/api/scan.js.
[browser]
binding = "BROWSER"

# KV namespace used by functions/api/_middleware.js for per-IP rate-limiting.
# Namespace ID created via the Cloudflare API (account-bound) on 2026-05-26.
# Production deploys also have this binding declared in the Pages dashboard.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "c5aad4cb07e7405e86c3cf1aebcae772"

# KV namespace for shareable scan results, OG card cache, and badge cache.
# Created via the Cloudflare API on 2026-05-28. Powers /r/:id, /og/:id.png,
# and /badge/:domain.svg (Phase 1 distribution primitives — see UX.md).
[[kv_namespaces]]
binding = "RESULTS"
id = "f8bbc9f7a16948a2995215321e679115"

# ── Preview KV (T-29 staging story; see docs/STAGING.md) ──────────────────────
# PR previews MUST NOT share production KV. After H-01 lands, create the
# preview namespaces (`bun apps/web/scripts/kv-namespaces.mjs ensure
# --binding RESULTS --apply`, same for RATE_LIMIT), then add one
# preview_id line per block below with the printed IDs. `preview_id` is
# what branch preview deployments bind; `id` stays production.
# Until the IDs exist, preview.yml is held from running by the same H-01
# gate (a preview without preview_id would bind PRODUCTION data).
# NOTE to tooling: readNamespaces() strips full-line comments and only
# matches a bare `id =` (never `preview_id`), so template lines below
# can never parse as live config — and real preview_ids stay invisible
# to the backup script (backups are production-scoped by design).
# RATE_LIMIT preview:  preview_id = "<preview-rate-limit-id>"
# RESULTS preview:     preview_id = "<preview-results-id>"

# Public Turnstile sitekey (safe to commit; the matching secret lives in
# Pages env vars and is never written to disk).
[vars]
TURNSTILE_SITEKEY = "0x4AAAAAADWirXpm1gXBhB5E"

# ── Operational env (set as Pages env vars / secrets, NOT committed) ──────────
# Cost & safety:
#   SCAN_DAILY_CAP    daily global browser-scan budget (default 10000)
#   SCAN_DISABLED     "1" to pause scanning (kill switch)
#   ERROR_WEBHOOK     optional Slack/Discord/Sentry URL for error alerts
# Captcha:
#   TURNSTILE_SECRET  Turnstile secret (required for browser scans)
# Monitoring alerts (all optional — absent ⇒ alerts no-op):
#   RESEND_API_KEY    Resend API key
#   ALERT_FROM        verified From, e.g. "Slop Detect <alerts@slop-detect.com>"
#   CRON_SECRET       Bearer secret for POST /api/cron/sweep
#   INTERNAL_API_KEY  an `unlimited`-tier API key for the sweep's internal re-scans
#   SWEEP_MAX         domains re-scanned per sweep (default 50)
# Dashboard (P2b; needs the email provider too):
#   SESSION_SECRET    HMAC secret for magic-link dashboard sessions
# See PRODUCTION.md for the full launch checklist.
